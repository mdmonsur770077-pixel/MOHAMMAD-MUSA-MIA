<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মনসুর লেবার পোর্টাল - MONSUR LABOR PORTAL</title>
  <meta name="description" content="মনসুর লেবার পোর্টাল - আর্কিটেকচারাল লেবার কন্ট্রোল হাব, বাৎসরিক ও মাসিক অডিট লেজার এবং রিয়েল-টাইম ব্যালেন্স হিসাব" />

  <!-- Google Fonts: Nikosh, Orbitron, Hind Siliguri -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nikosh', 'Hind Siliguri', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React, ReactDOM, Babel for Single-File Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js for 3D Architectural Blueprint -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      font-size: 16px;
      font-family: 'Nikosh', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #050814;
      color: #e6f1ff;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    input, select, textarea, button {
      font-size: 16px;
      font-family: inherit;
    }
    .glass-panel {
      background: rgba(11, 19, 43, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 1rem;
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      #three-canvas-container, .no-print {
        display: none !important;
      }
      .glass-panel {
        border: 1px solid #ccc !important;
        background: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- বাংলা তারিখ ও সংখ্যা সহায়তা ফাংশন ---
    const BANGLA_MONTHS = [
      'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
      'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'
    ];

    const toBanglaNumber = (num) => {
      if (num === undefined || num === null) return '';
      const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().replace(/[0-9]/g, (digit) => banglaDigits[parseInt(digit, 10)]);
    };

    const parseDate = (dateString) => {
      const [y, m, d] = dateString.split('-');
      return {
        year: parseInt(y, 10),
        monthIndex: parseInt(m, 10),
        day: parseInt(d, 10)
      };
    };

    // --- প্রাথমিক ডেমো ডেটা ---
    const INITIAL_WORKERS = [
      { id: 'w-1', name: 'আবদুর রহমান', dailyWage: 800, trade: 'হেড রাজমিস্ত্রি', phone: '01711-234567', createdAt: '2026-07-01' },
      { id: 'w-2', name: 'মোঃ খোকন মিয়া', dailyWage: 650, trade: 'রড বাইন্ডার', phone: '01822-345678', createdAt: '2026-07-01' },
      { id: 'w-3', name: 'সুমন হোসেন', dailyWage: 500, trade: 'হেল্পার / জোগালি', phone: '01933-456789', createdAt: '2026-07-02' },
      { id: 'w-4', name: 'কামাল পাশা', dailyWage: 750, trade: 'কাঠমিস্ত্রি (শাটারিং)', phone: '01644-567890', createdAt: '2026-07-02' },
      { id: 'w-5', name: 'জাহাঙ্গীর আলম', dailyWage: 850, trade: 'ইলেকট্রিশিয়ান', phone: '01755-678901', createdAt: '2026-07-03' }
    ];

    const INITIAL_RECORDS = [
      { id: 'rec-1', workerId: 'w-1', date: '2026-09-02', days: 1, paid: 0, advance: 1000, note: 'সাইট কাজের শুরু ও হাতখরচ' },
      { id: 'rec-2', workerId: 'w-1', date: '2026-09-03', days: 1, paid: 500, advance: 500, note: '১ম তলা গাঁথুনি' },
      { id: 'rec-3', workerId: 'w-1', date: '2026-09-04', days: 1, paid: 1000, advance: 0, note: 'দেয়াল প্লাস্টার' },
      { id: 'rec-4', workerId: 'w-1', date: '2026-09-05', days: 1, paid: 0, advance: 1000, note: 'জরুরি পারিবারিক অগ্রিম' },
      { id: 'rec-5', workerId: 'w-1', date: '2026-09-06', days: 1, paid: 500, advance: 0, note: 'কলাম ঢালাই তদারকি' },
      { id: 'rec-6', workerId: 'w-2', date: '2026-09-03', days: 1, paid: 400, advance: 500, note: 'বীম রড বাইন্ডিং' },
      { id: 'rec-7', workerId: 'w-2', date: '2026-09-04', days: 1, paid: 400, advance: 0, note: 'ছাদ রড বিছানো' },
      { id: 'rec-8', workerId: 'w-2', date: '2026-09-05', days: 1, paid: 400, advance: 0, note: 'ছাদ রড বাঁধা সমাপ্ত' },
      { id: 'rec-9', workerId: 'w-2', date: '2026-09-06', days: 1, paid: 0, advance: 0, note: 'রড কাটিং ও ব্যান্ডিং' },
      { id: 'rec-10', workerId: 'w-3', date: '2026-09-04', days: 1, paid: 500, advance: 0, note: 'বালু সিমেন্ট মিক্সিং' },
      { id: 'rec-11', workerId: 'w-3', date: '2026-09-05', days: 1, paid: 500, advance: 0, note: 'ইট বহন ও পানি দেওয়া' },
      { id: 'rec-12', workerId: 'w-3', date: '2026-09-06', days: 1.5, paid: 750, advance: 0, note: 'ওভারটাইমসহ ঢালাই সহায়তা' },
      { id: 'rec-13', workerId: 'w-4', date: '2026-09-04', days: 1, paid: 500, advance: 1000, note: 'শাটারিং বোর্ড তৈরি' },
      { id: 'rec-14', workerId: 'w-4', date: '2026-09-05', days: 1, paid: 500, advance: 500, note: 'ছাদের প্রপস বসানো' },
      { id: 'rec-15', workerId: 'w-4', date: '2026-09-06', days: 1, paid: 0, advance: 0, note: 'বীম সাইড শাটারিং' },
      { id: 'rec-16', workerId: 'w-5', date: '2026-09-05', days: 1, paid: 850, advance: 0, note: 'মেইন সুইচবোর্ড ওয়ারিং' },
      { id: 'rec-aug-1', workerId: 'w-1', date: '2026-08-12', days: 2, paid: 1000, advance: 500, note: 'বেইজমেন্ট ওয়াল গাঁথুনি' },
      { id: 'rec-aug-2', workerId: 'w-1', date: '2026-08-25', days: 3, paid: 1500, advance: 0, note: 'গ্রাউন্ড ফ্লোর কলাম' }
    ];

    // --- ৩ডি আর্কিটেকচারাল ব্লুপ্রিন্ট ব্যাকগ্রাউন্ড ---
    function ThreeBackground() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.THREE) return;
        const container = containerRef.current;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050814, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // আর্কিটেকচারাল গ্রিড ও টাওয়ার গ্রুপ
        const group = new THREE.Group();
        scene.add(group);

        const gridHelper = new THREE.GridHelper(50, 40, 0x00f2fe, 0x1a2b50);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // টাওয়ার ফ্রেম কলাম ও স্ল্যাব
        const columnGeo = new THREE.BoxGeometry(0.3, 14, 0.3);
        const columnMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true });
        
        for (let x of [-4, 0, 4]) {
          for (let z of [-4, 0, 4]) {
            const col = new THREE.Mesh(columnGeo, columnMat);
            col.position.set(x, 2, z);
            group.add(col);
          }
        }

        const slabGeo = new THREE.BoxGeometry(9, 0.1, 9);
        const slabMat = new THREE.MeshBasicMaterial({ color: 0x4facfe, wireframe: true });
        for (let y = -4; y <= 8; y += 3) {
          const slab = new THREE.Mesh(slabGeo, slabMat);
          slab.position.set(0, y, 0);
          group.add(slab);
        }

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          group.rotation.y += 0.003;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div id="three-canvas-container" ref={containerRef} className="fixed inset-0 pointer-events-none z-0 opacity-45" />;
    }

    // --- প্রধান অ্যাপ কম্পোনেন্ট ---
    function App() {
      // লোকাল স্টোরেজ থেকে ডেটা লোড
      const [workers, setWorkers] = useState(() => {
        try {
          const saved = localStorage.getItem('monsur_workers');
          return saved ? JSON.parse(saved) : INITIAL_WORKERS;
        } catch (e) {
          return INITIAL_WORKERS;
        }
      });

      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('monsur_records');
          return saved ? JSON.parse(saved) : INITIAL_RECORDS;
        } catch (e) {
          return INITIAL_RECORDS;
        }
      });

      // লোকাল স্টোরেজ আপডেট
      useEffect(() => {
        localStorage.setItem('monsur_workers', JSON.stringify(workers));
      }, [workers]);

      useEffect(() => {
        localStorage.setItem('monsur_records', JSON.stringify(records));
      }, [records]);

      // ফিল্টার স্টেট (বছর ও মাস)
      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState('all'); // 'all' বা ১-১২
      const [mobileViewMode, setMobileViewMode] = useState('cards'); // 'cards' বা 'table'
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');

      // নতুন লেবার ফর্ম স্টেট
      const [newWorkerName, setNewWorkerName] = useState('');
      const [newWorkerWage, setNewWorkerWage] = useState('');
      const [newWorkerTrade, setNewWorkerTrade] = useState('রাজমিস্ত্রি');
      const [newWorkerPhone, setNewWorkerPhone] = useState('');

      // দৈনিক লেনদেন ফর্ম স্টেট
      const [selectedWorkerId, setSelectedWorkerId] = useState(workers[0]?.id || '');
      const [txDate, setTxDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [txDays, setTxDays] = useState('1');
      const [txPaid, setTxPaid] = useState('0');
      const [txAdvance, setTxAdvance] = useState('0');
      const [txNote, setTxNote] = useState('');

      // মডাল স্টেট
      const [detailWorker, setDetailWorker] = useState(null);

      // উপলব্ধ বছর বের করা
      const availableYears = useMemo(() => {
        const set = new Set([2026]);
        records.forEach(r => set.add(parseDate(r.date).year));
        return Array.from(set).sort((a, b) => b - a);
      }, [records]);

      // নির্দিষ্ট সময়কালের সামারি ক্যালকুলেশন
      const summaries = useMemo(() => {
        return workers.map(worker => {
          const workerRecords = records.filter(r => {
            if (r.workerId !== worker.id) return false;
            const { year, monthIndex } = parseDate(r.date);
            if (selectedYear !== 'all' && year !== selectedYear) return false;
            if (selectedMonth !== 'all' && monthIndex !== selectedMonth) return false;
            return true;
          });

          let totalDays = 0;
          let totalPaid = 0;
          let totalAdvance = 0;

          workerRecords.forEach(r => {
            totalDays += parseFloat(r.days || 0);
            totalPaid += parseFloat(r.paid || 0);
            totalAdvance += parseFloat(r.advance || 0);
          });

          const totalEarned = totalDays * worker.dailyWage;
          const totalReceived = totalPaid + totalAdvance;
          const balance = totalEarned - totalReceived;

          let status = 'settled';
          if (balance < 0) status = 'claim'; // কোম্পানি পাবে
          else if (balance > 0) status = 'due'; // লেবার পাবে

          return {
            worker,
            totalDays,
            totalEarned,
            totalPaid,
            totalAdvance,
            totalReceived,
            balance,
            status,
            recordCount: workerRecords.length
          };
        });
      }, [workers, records, selectedYear, selectedMonth]);

      // সার্চ ও স্ট্যাটাস ফিল্টার
      const filteredSummaries = useMemo(() => {
        return summaries.filter(s => {
          const matchesSearch = s.worker.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (s.worker.trade && s.worker.trade.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesStatus = filterStatus === 'all' || s.status === filterStatus;
          return matchesSearch && matchesStatus;
        });
      }, [summaries, searchQuery, filterStatus]);

      // সার্বিক মোট পরিসংখ্যান
      const stats = useMemo(() => {
        let totalClaim = 0;
        let totalDue = 0;
        let totalDays = 0;
        summaries.forEach(s => {
          totalDays += s.totalDays;
          if (s.balance < 0) totalClaim += Math.abs(s.balance);
          else if (s.balance > 0) totalDue += s.balance;
        });
        return { totalClaim, totalDue, totalDays };
      }, [summaries]);

      // নতুন লেবার যোগ
      const handleAddWorker = (e) => {
        e.preventDefault();
        if (!newWorkerName.trim() || !newWorkerWage) return;
        const newW = {
          id: 'w-' + Date.now(),
          name: newWorkerName.trim(),
          dailyWage: parseFloat(newWorkerWage) || 0,
          trade: newWorkerTrade.trim() || 'সাধারণ শ্রমিক',
          phone: newWorkerPhone.trim(),
          createdAt: new Date().toISOString().split('T')[0]
        };
        setWorkers([newW, ...workers]);
        setNewWorkerName('');
        setNewWorkerWage('');
        setNewWorkerPhone('');
        alert('নতুন লেবার সফলভাবে যুক্ত হয়েছে!');
      };

      // দৈনিক এন্ট্রি যোগ
      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!selectedWorkerId) return;
        const newRec = {
          id: 'rec-' + Date.now(),
          workerId: selectedWorkerId,
          date: txDate,
          days: parseFloat(txDays) || 0,
          paid: parseFloat(txPaid) || 0,
          advance: parseFloat(txAdvance) || 0,
          note: txNote.trim()
        };
        setRecords([newRec, ...records]);
        setTxPaid('0');
        setTxAdvance('0');
        setTxNote('');
        alert('দৈনিক হাজিরা ও লেনদেন সফলভাবে সংরক্ষিত হয়েছে!');
      };

      // লেবার ডিলিট
      const handleDeleteWorker = (workerId) => {
        if (confirm('আপনি কি নিশ্চিত যে এই লেবারের সমস্ত খতিয়ান ডিলিট করতে চান?')) {
          setWorkers(workers.filter(w => w.id !== workerId));
          setRecords(records.filter(r => r.workerId !== workerId));
        }
      };

      // CSV এক্সপোর্ট
      const handleExportCSV = () => {
        const headers = ['নাম', 'ট্রেড', 'দৈনিক রেট', 'হাজিরা দিন', 'অর্জিত আয়', 'মজুরি পরিশোধ', 'অগ্রিম', 'ব্যালেন্স'];
        const rows = summaries.map(s => [
          `"${s.worker.name}"`,
          `"${s.worker.trade || ''}"`,
          s.worker.dailyWage,
          s.totalDays,
          s.totalEarned,
          s.totalPaid,
          s.totalAdvance,
          s.balance
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `monsur_labor_report_${selectedYear}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const periodText = selectedYear === 'all' 
        ? 'সকল বছরের হিসাব' 
        : `${toBanglaNumber(selectedYear)} সাল ${selectedMonth === 'all' ? '(বাৎসরিক)' : `(${BANGLA_MONTHS[selectedMonth - 1]})`}`;

      return (
        <div className="relative min-h-screen pb-20">
          <ThreeBackground />

          <div className="max-w-[1300px] mx-auto px-4 sm:px-6 pt-6 relative z-10">
            {/* হেডার */}
            <header className="text-center mb-6">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#00f2fe]/10 border border-[#00f2fe]/30 text-[#00f2fe] text-xs sm:text-sm mb-3 font-semibold shadow-[0_0_15px_rgba(0,242,254,0.2)]">
                <span>🏗️ মনসুর লেবার কন্ট্রোল সিস্টেম</span>
              </div>
              <h1 className="text-3xl sm:text-5xl font-black font-orbitron tracking-wide bg-gradient-to-r from-[#00f2fe] via-[#4facfe] to-[#00f2fe] bg-clip-text text-transparent drop-shadow-[0_0_25px_rgba(0,242,254,0.4)]">
                MONSUR LABOR PORTAL
              </h1>
              <div className="text-xl sm:text-2xl font-bold text-cyan-300 mt-1">
                মনসুর লেবার পোর্টাল
              </div>
              <p className="text-slate-300 text-sm sm:text-base mt-2 max-w-xl mx-auto">
                বাৎসরিক ও মাসিক হিসাব অডিট, দৈনিক হাজিরা এন্ট্রি ও ব্যালেন্স খতিয়ান
              </p>
            </header>

            {/* বছর ও মাস নির্বাচন বার */}
            <div className="glass-panel p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <span className="text-sm font-bold text-[#00f2fe]">বছর:</span>
                {availableYears.map(yr => (
                  <button
                    key={yr}
                    onClick={() => setSelectedYear(yr)}
                    className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-all ${

                      <tr className="bg-white/5 text-slate-400">
                        <th className="p-2">তারিখ</th>
                        <th className="p-2 text-center">হাজিরা</th>
                        <th className="p-2 text-right">মজুরি পরিশোধ</th>
                        <th className="p-2 text-right text-[#ff416c]">অগ্রিম</th>
                        <th className="p-2">নোট</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {records
                        .filter(r => r.workerId === detailWorker.id)
                        .map(r => (
                          <tr key={r.id}>
                            <td className="p-2 font-mono">{r.date}</td>
                            <td className="p-2 text-center font-bold">{r.days} দিন</td>
                            <td className="p-2 text-right font-orbitron">৳{r.paid}</td>
                            <td className="p-2 text-right font-orbitron text-[#ff416c]">৳{r.advance}</td>
                            <td className="p-2 text-slate-400">{r.note || '-'}</td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 border-t border-white/10 flex justify-end">
                  <button
                    onClick={() => setDetailWorker(null)}
                    className="px-4 py-2 rounded-lg bg-white/10 text-xs text-white"
                  >
                    বন্ধ করুন
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // মাউন্ট অ্যাপ্লিকেশন
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
