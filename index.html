<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D লেবার কন্ট্রোল হাব - মনসুর লেবার পোর্টাল</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Hind Siliguri', 'Noto Sans Bengali', 'sans-serif'],
            orbitron: ['Orbitron', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js (3D Blueprint Background) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      background-color: #050814;
      color: #e6f1ff;
      overflow-x: hidden;
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    }
    .font-orbitron {
      font-family: 'Orbitron', monospace;
    }
    .glass-panel {
      background: rgba(8, 15, 35, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .glass-panel { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <!-- 3D Three.js Architecture Background -->
  <div id="three-bg" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- React Root Container -->
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const BANGLA_MONTHS = [
      'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
      'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'
    ];

    const toBanglaNumber = (num) => {
      if (num === undefined || num === null) return '';
      const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().split('').map(d => (d >= '0' && d <= '9' ? banglaDigits[parseInt(d, 10)] : d)).join('');
    };

    const roundMoney = (val) => Math.round((Number(val || 0) + Number.EPSILON) * 100) / 100;

    const getTodayDateString = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    // Initial Demo Dataset
    const INITIAL_WORKERS = [
      { id: 'w-1', name: 'আব্দুল করিম', phone: '01711223344', dailyWage: 800, initialAdvance: 1000, notes: 'প্রধান মেকানিক' },
      { id: 'w-2', name: 'রফিকুল ইসলাম', phone: '01822334455', dailyWage: 650, initialAdvance: 0, notes: 'ঢালাই মিস্ত্রি' },
      { id: 'w-3', name: 'সুমন মিয়া', phone: '01933445566', dailyWage: 500, initialAdvance: 500, notes: 'সহকারী হেল্পার' }
    ];

    const INITIAL_TRANSACTIONS = [
      { id: 't-1', workerId: 'w-1', date: '2026-09-01', days: 1, paid: 500, advance: 0, notes: '৩য় তলা ছাদ ঢালাই, আবহাওয়া অনুকূল' },
      { id: 't-2', workerId: 'w-1', date: '2026-09-02', days: 1, paid: 800, advance: 200, notes: 'গাথুনির কাজ সম্পন্ন, অতিরিক্ত ভালো কাজের বোনাস' },
      { id: 't-3', workerId: 'w-2', date: '2026-09-01', days: 1.5, paid: 600, advance: 0, notes: 'বৃষ্টির কারণে বিলম্ব, ওভারটাইমসহ ফুল ডে' },
      { id: 't-4', workerId: 'w-3', date: '2026-09-02', days: 1, paid: 0, advance: 300, notes: 'জরুরি চিকিৎসা/হাতখরচ অগ্রিম' }
    ];

    function App() {
      const [workers, setWorkers] = useState(() => {
        const saved = localStorage.getItem('monsur_portal_workers_v2');
        return saved ? JSON.parse(saved) : INITIAL_WORKERS;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('monsur_portal_tx_v2');
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState(9); // September

      // New Worker Form
      const [newWorkerName, setNewWorkerName] = useState('');
      const [newWorkerPhone, setNewWorkerPhone] = useState('');
      const [newWorkerWage, setNewWorkerWage] = useState('');
      const [newWorkerAdvance, setNewWorkerAdvance] = useState('');

      // New Daily Transaction Form with Remarks
      const [entryWorkerId, setEntryWorkerId] = useState('');
      const [entryDate, setEntryDate] = useState(getTodayDateString());
      const [entryDays, setEntryDays] = useState('1');
      const [entryPaid, setEntryPaid] = useState('');
      const [entryAdvance, setEntryAdvance] = useState('');
      const [entryRemarks, setEntryRemarks] = useState('');

      // Modal Details State
      const [activeModalWorker, setActiveModalWorker] = useState(null);

      // LocalStorage Sync
      useEffect(() => {
        localStorage.setItem('monsur_portal_workers_v2', JSON.stringify(workers));
      }, [workers]);

      useEffect(() => {
        localStorage.setItem('monsur_portal_tx_v2', JSON.stringify(transactions));
      }, [transactions]);

      // Summaries Calculation
      const periodSummaries = useMemo(() => {
        return workers.map(w => {
          const wTx = transactions.filter(t => {
            if (t.workerId !== w.id) return false;
            const [tY, tM] = t.date.split('-').map(Number);
            return tY === selectedYear && tM === selectedMonth;
          });

          const totalDays = wTx.reduce((sum, t) => sum + (Number(t.days) || 0), 0);
          const totalEarned = roundMoney(totalDays * (w.dailyWage || 0));
          const totalPaid = roundMoney(wTx.reduce((sum, t) => sum + (Number(t.paid) || 0), 0));
          const totalAdvance = roundMoney(wTx.reduce((sum, t) => sum + (Number(t.advance) || 0), 0));
          const totalPaidAll = roundMoney(totalPaid + totalAdvance);
          const balance = roundMoney(totalEarned - totalPaidAll);

          return {
            worker: w,
            totalDays,
            totalEarned,
            totalPaid,
            totalAdvance,
            totalPaidAll,
            balance,
            records: wTx
          };
        });
      }, [workers, transactions, selectedYear, selectedMonth]);

      // 12-Month Yearly Financial Trend
      const yearlyTrend = useMemo(() => {
        return BANGLA_MONTHS.map((mName, idx) => {
          const mNum = idx + 1;
          let mEarned = 0;
          let mExp = 0;
          let mDays = 0;

          transactions.forEach(t => {
            const [tY, tM] = t.date.split('-').map(Number);
            if (tY === selectedYear && tM === mNum) {
              const matchedW = workers.find(w => w.id === t.workerId);
              const wage = matchedW ? matchedW.dailyWage : 0;
              mDays += Number(t.days || 0);
              mEarned += Number(t.days || 0) * wage;
              mExp += (Number(t.paid || 0) + Number(t.advance || 0));
            }
          });

          return {
            month: mName,
            monthNum: mNum,
            earned: roundMoney(mEarned),
            expenditure: roundMoney(mExp),
            net: roundMoney(mEarned - mExp),
            days: mDays
          };
        });
      }, [workers, transactions, selectedYear]);

      // Financial Metrics for Active Selection
      const totalEarned = roundMoney(periodSummaries.reduce((a, b) => a + b.totalEarned, 0));
      const totalPaid = roundMoney(periodSummaries.reduce((a, b) => a + b.totalPaid, 0));
      const totalAdvance = roundMoney(periodSummaries.reduce((a, b) => a + b.totalAdvance, 0));
      const totalExpenditure = roundMoney(totalPaid + totalAdvance);
      const totalDaysCount = periodSummaries.reduce((a, b) => a + b.totalDays, 0);
      const netGain = roundMoney(totalEarned - totalExpenditure);

      // Add Worker
      const handleAddWorker = (e) => {
        e.preventDefault();
        if (!newWorkerName || !newWorkerWage) return;
        const newW = {
          id: 'w-' + Date.now(),
          name: newWorkerName,
          phone: newWorkerPhone || 'প্রযোজ্য নয়',
          dailyWage: parseFloat(newWorkerWage) || 0,
          initialAdvance: parseFloat(newWorkerAdvance) || 0,
          createdAt: Date.now()
        };
        setWorkers([newW, ...workers]);
        setNewWorkerName('');
        setNewWorkerPhone('');
        setNewWorkerWage('');
        setNewWorkerAdvance('');
      };

      // Add Daily Transaction with Remarks
      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!entryWorkerId) return;
        const newT = {
          id: 't-' + Date.now(),
          workerId: entryWorkerId,
          date: entryDate,
          days: parseFloat(entryDays) || 0,
          paid: parseFloat(entryPaid) || 0,
          advance: parseFloat(entryAdvance) || 0,
          notes: entryRemarks.trim(),
          createdAt: Date.now()
        };
        setTransactions([newT, ...transactions]);
        setEntryPaid('');
        setEntryAdvance('');
        setEntryRemarks('');
      };

      const handleDeleteWorker = (workerId) => {
        if (confirm('আপনি কি নিশ্চিতভাবে এই শ্রমিক এবং তার সমস্ত রেকর্ড মুছে ফেলতে চান?')) {
          setWorkers(workers.filter(w => w.id !== workerId));
          setTransactions(transactions.filter(t => t.workerId !== workerId));
        }
      };

      return (
        <div className="min-h-screen pb-16 px-3 sm:px-6 max-w-7xl mx-auto">
          {/* Header */}
          <header className="py-6 border-b border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-400 via-blue-500 to-emerald-400 flex items-center justify-center font-black text-black text-xl font-orbitron shadow-lg shadow-cyan-500/20">
                3D
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black tracking-wide text-white">
                  মনসুর লেবার পোর্টাল
                </h1>
                <p className="text-xs text-cyan-400 font-medium">
                  আর্কিটেকচারাল লেবার কন্ট্রোল হাব ও বাৎসরিক-মাসিক অডিট লেজার
                </p>
              </div>
            </div>

            {/* Year / Month Filter Toolbar */}
            <div className="flex items-center gap-2 flex-wrap">
              <select 
                value={selectedYear} 
                onChange={(e) => setSelectedYear(Number(e.target.value))}
                className="bg-black/60 border border-white/20 rounded-xl px-3.5 py-2 text-sm text-white font-orbitron focus:outline-none focus:border-cyan-400 cursor-pointer"
              >
                <option value={2025}>2025</option>
                <option value={2026}>2026</option>
                <option value={2027}>2027</option>
              </select>

              <select 
                value={selectedMonth} 
                onChange={(e) => setSelectedMonth(Number(e.target.value))}
                className="bg-black/60 border border-white/20 rounded-xl px-3.5 py-2 text-sm text-cyan-300 font-sans focus:outline-none focus:border-cyan-400 cursor-pointer"
              >
                {BANGLA_MONTHS.map((m, idx) => (
                  <option key={idx} value={idx + 1}>{m}</option>
                ))}
              </select>

              <button 
                onClick={() => window.print()} 
                className="no-print bg-white/10 hover:bg-white/20 border border-white/20 text-xs px-3.5 py-2.5 rounded-xl font-semibold transition flex items-center gap-1.5 cursor-pointer"
              >
                🖨️ লেজার প্রিন্ট
              </button>
            </div>
          </header>

          {/* Profit/Loss Summary Card */}
          <div className="glass-panel p-5 sm:p-6 mb-6 rounded-2xl border border-white/15 bg-gradient-to-r from-[#071325]/95 via-[#091734]/90 to-[#0c1f3d]/95 shadow-[0_4px_25px_rgba(0,0,0,0.5)]">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4 mb-5">
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <h2 className="text-lg font-bold text-white tracking-wide">
                    Profit/Loss Summary
                  </h2>
                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300">
                    লাভ-ক্ষতি ও ব্যয় বিশ্লেষণ
                  </span>
                  <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 font-orbitron">
                    {BANGLA_MONTHS[selectedMonth - 1]} {toBanglaNumber(selectedYear)}
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  নির্বাচিত মাসে মোট শ্রমের অর্জিত মূল্য বনাম কোম্পানির মোট নগদ খরচের তুলনামূলক বিশ্লেষণ
                </p>
              </div>

              <div className={`px-4 py-2.5 rounded-xl border flex items-center gap-3 ${netGain >= 0 ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300' : 'bg-[#ff416c]/15 border-[#ff416c]/30 text-[#ff416c]'}`}>
                <div className="text-right">
                  <div className="text-[10px] uppercase font-bold tracking-wider opacity-80">নিট স্থিতি (Net Balance)</div>
                  <div className="font-orbitron font-extrabold text-xl">
                    {netGain >= 0 ? `+৳ ${netGain.toLocaleString()}` : `-৳ ${Math.abs(netGain).toLocaleString()}`}
                  </div>
                </div>
                <span className="text-xs font-bold border-l border-white/15 pl-2">
                  {netGain >= 0 ? 'উদ্বৃত্ত' : 'ঘাটতি'}
                </span>
              </div>
            </div>

            {/* 4 Financial Performance Metric Tiles */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 mb-6">
              <div className="p-4 rounded-xl bg-black/40 border border-[#ff416c]/30">
                <div className="text-xs font-bold text-[#ff416c] uppercase">কোম্পানির মোট ব্যয় (Expenditure)</div>
                <div className="font-orbitron text-2xl font-black text-[#ff416c] mt-1">৳ {totalExpenditure.toLocaleString()}</div>
                <div className="text-[11px] text-slate-400 mt-1 flex justify-between border-t border-white/5 pt-1">
                  <span>মজুরি: ৳{totalPaid.toLocaleString()}</span>
                  <span>অগ্রিম: ৳{totalAdvance.toLocaleString()}</span>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-black/40 border border-cyan-500/30">
                <div className="text-xs font-bold text-cyan-400 uppercase">কাজের অর্জিত মূল্য (Labor Value)</div>
                <div className="font-orbitron text-2xl font-black text-cyan-400 mt-1">৳ {totalEarned.toLocaleString()}</div>
                <div className="text-[11px] text-slate-400 mt-1 flex justify-between border-t border-white/5 pt-1">
                  <span>মোট কাজের দিন</span>
                  <span className="font-orbitron text-cyan-300">{totalDaysCount} দিন</span>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-black/40 border border-emerald-500/30">
                <div className="text-xs font-bold text-emerald-400 uppercase">নিট মার্জিন / সাশ্রয়</div>
                <div className="font-orbitron text-2xl font-black text-emerald-400 mt-1">৳ {netGain.toLocaleString()}</div>
                <div className="text-[11px] text-slate-400 mt-1 border-t border-white/5 pt-1">
                  {netGain >= 0 ? 'কোম্পানি নগদ উদ্বৃত্তে আছে' : 'কাজের মূল্যের চেয়ে নগদ খরচ বেশি'}
                </div>
              </div>

              <div className="p-4 rounded-xl bg-black/40 border border-purple-500/30">
                <div className="text-xs font-bold text-purple-400 uppercase">সক্রিয় শ্রমিক সংখ্যা</div>
                <div className="font-orbitron text-2xl font-black text-purple-300 mt-1">{toBanglaNumber(periodSummaries.length)} জন</div>
                <div className="text-[11px] text-slate-400 mt-1 border-t border-white/5 pt-1">
                  নিবন্ধিত শ্রমিক খতিয়ান
                </div>
              </div>
            </div>

            {/* Yearly 12 Months Visual Trend Cards */}
            <div className="border-t border-white/10 pt-4">
              <h4 className="text-xs font-bold text-slate-300 mb-2.5 flex items-center gap-2">
                <span>📈 {toBanglaNumber(selectedYear)} সালের ১২ মাসের ধারাবাহিক লাভ-ক্ষতি ও ব্যয় চিত্র:</span>
              </h4>
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2">
                {yearlyTrend.map(m => (
                  <div 
                    key={m.monthNum} 
                    onClick={() => setSelectedMonth(m.monthNum)}
                    className={`p-2 rounded-lg border text-xs cursor-pointer transition ${
                      selectedMonth === m.monthNum 
                        ? 'bg-cyan-500/20 border-cyan-400 text-white shadow-lg' 
                        : 'bg-black/30 border-white/5 text-slate-400 hover:bg-white/5'
                    }`}
                  >
                    <div className="font-bold flex justify-between">
                      <span>{m.month}</span>
                      <span className="font-orbitron text-[10px]">{m.days} দিন</span>
                    </div>
                    <div className="text-[10px] mt-1 text-[#ff416c]">ব্যয়: ৳{m.expenditure}</div>
                    <div className="text-[10px] text-cyan-300">মূল্য: ৳{m.earned}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Action Grid: Forms */}
          <div className="no-print grid grid-cols-1 lg:grid-cols-2 gap-5 mb-8">
            {/* 1. Add Worker Registration */}
            <div className="glass-panel p-5 rounded-2xl border border-white/10">
              <h3 className="text-sm font-bold text-cyan-300 mb-3 flex items-center gap-2">
                <span>➕ নতুন লেবার রেজিস্ট্রেশন</span>
              </h3>
              <form onSubmit={handleAddWorker} className="grid grid-cols-2 gap-3">
                <input 
                  type="text" 
                  placeholder="শ্রমিকের নাম *" 
                  required
                  value={newWorkerName}
                  onChange={(e) => setNewWorkerName(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" 
                />
                <input 
                  type="text" 
                  placeholder="ফোন নম্বর" 
                  value={newWorkerPhone}
                  onChange={(e) => setNewWorkerPhone(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" 
                />
                <input 
                  type="number" 
                  placeholder="দৈনিক হাজিরা মজুরি (টাকা) *" 
                  required
                  value={newWorkerWage}
                  onChange={(e) => setNewWorkerWage(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" 
                />
                <input 
                  type="number" 
                  placeholder="প্রাথমিক বকেয়া/অগ্রিম" 
                  value={newWorkerAdvance}
                  onChange={(e) => setNewWorkerAdvance(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" 
                />
                <button 
                  type="submit" 
                  className="col-span-2 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold text-xs rounded-xl transition cursor-pointer"
                >
                  লেবার সংরক্ষণ করুন
                </button>
              </form>
            </div>

            {/* 2. Daily Entry Form with Remarks / Site Conditions */}
            <div className="glass-panel p-5 rounded-2xl border border-white/10">
              <h3 className="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2">
                <span>📝 দৈনিক হাজিরা ও লেনদেন এন্ট্রি</span>
              </h3>
              <form onSubmit={handleAddTransaction} className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <select 
                  required
                  value={entryWorkerId}
                  onChange={(e) => setEntryWorkerId(e.target.value)}
                  className="col-span-2 sm:col-span-1 bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400 cursor-pointer"
                >
                  <option value="">শ্রমিক নির্বাচন করুন *</option>
                  {workers.map(w => (
                    <option key={w.id} value={w.id}>{w.name} ({w.dailyWage}৳)</option>
                  ))}
                </select>

                <input 
                  type="date" 
                  required
                  value={entryDate}
                  onChange={(e) => setEntryDate(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white font-orbitron focus:outline-none focus:border-emerald-400" 
                />

                <input 
                  type="number" 
                  step="0.5" 
                  placeholder="হাজিরা দিন (1, 0.5)" 
                  value={entryDays}
                  onChange={(e) => setEntryDays(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400" 
                />

                <input 
                  type="number" 
                  placeholder="প্রদত্ত মজুরি (টাকা)" 
                  value={entryPaid}
                  onChange={(e) => setEntryPaid(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400" 
                />

                <input 
                  type="number" 
                  placeholder="অগ্রিম টাকা" 
                  value={entryAdvance}
                  onChange={(e) => setEntryAdvance(e.target.value)}
                  className="bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400" 
                />

                {/* Remarks & Site Condition with Preset Chips */}
                <div className="col-span-2 sm:col-span-3">
                  <div className="flex items-center justify-between mb-1.5 flex-wrap gap-1">
                    <label className="block text-xs font-medium text-slate-300 flex items-center gap-1.5">
                      <span className="text-[#00f2fe]">মন্তব্য / সাইট কন্ডিশন / কাজের বিবরণ (Remarks)</span>
                      <span className="text-[10px] text-slate-400 font-normal">(ঐচ্ছিক)</span>
                    </label>
                    <span className="text-[10px] text-slate-400">সাইটের অবস্থা, কাজের পারফর্মেন্স বা নির্দিষ্ট টাস্ক উল্লেখ করুন</span>
                  </div>
                  <input 
                    type="text" 
                    placeholder="যেমন: ৩য় তলা ছাদ ঢালাই, বৃষ্টিতে ২ ঘণ্টা কাজ বন্ধ, অতিরিক্ত ভালো কাজ, ওটি সম্পন্ন" 
                    value={entryRemarks}
                    onChange={(e) => setEntryRemarks(e.target.value)}
                    className="w-full bg-black/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-[#00f2fe] transition" 
                  />

                  {/* Preset Condition Tag Buttons */}
                  <div className="flex flex-wrap items-center gap-1.5 mt-2">
                    <span className="text-[10px] text-slate-400 mr-0.5">কুইক ট্যাগ:</span>
                    {[
                      '৩য় তলা ছাদ ঢালাই',
                      'গাথুনির কাজ সম্পন্ন',
                      'প্লাস্টার ও ফিনিশিং',
                      'বৃষ্টির কারণে বিলম্ব',
                      'ভালো কাজের বোনাস/টিপস',
                      'ওভারটাইমসহ ফুল ডে',
                      'সাইট সরঞ্জাম হ্যান্ডলিং',
                      'জরুরি চিকিৎসা/হাতখরচ'
                    ].map(tag => (
                      <button
                        key={tag}
                        type="button"
                        onClick={() => {
                          if (!entryRemarks.trim()) {
                            setEntryRemarks(tag);
                          } else if (!entryRemarks.includes(tag)) {
                            setEntryRemarks(`${entryRemarks}, ${tag}`);
                          }
                        }}
                        className="text-[10px] px-2 py-0.5 rounded-md bg-white/5 hover:bg-[#00f2fe]/15 border border-white/10 hover:border-[#00f2fe]/40 text-slate-300 hover:text-cyan-300 transition-colors cursor-pointer"
                      >
                        + {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <button 
                  type="submit" 
                  className="col-span-2 sm:col-span-3 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-black font-bold text-xs rounded-xl transition cursor-pointer"
                >
                  লেনদেন এন্ট্রি নিশ্চিত করুন
                </button>
              </form>
            </div>
          </div>

          {/* Master Labor Audit Ledger Table */}
          <div className="glass-panel rounded-2xl border border-white/10 overflow-hidden shadow-2xl">
            <div className="p-4 border-b border-white/10 flex items-center justify-between">
              <h3 className="font-bold text-sm text-white">
                মাস্টার লেবার অডিট লেজার — {BANGLA_MONTHS[selectedMonth - 1]} {toBanglaNumber(selectedYear)}
              </h3>
              <span className="text-xs text-cyan-400 font-orbitron">{periodSummaries.length} জন শ্রমিক</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-black/40 text-slate-400 border-b border-white/10">
                  <tr>
                    <th className="p-3">শ্রমিকের নাম</th>
                    <th className="p-3">দৈনিক রেট</th>
                    <th className="p-3 text-center">মোট হাজিরা</th>
                    <th className="p-3 text-right">কাজের মূল্য</th>
                    <th className="p-3 text-right">প্রদত্ত মজুরি</th>
                    <th className="p-3 text-right">দেওয়া অগ্রিম</th>
                    <th className="p-3 text-right">মোট ব্যয়</th>
                    <th className="p-3 text-right">ব্যালেন্স স্থিতি</th>
                    <th className="p-3 text-center no-print">অ্যাকশন</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5 font-sans">
                  {periodSummaries.map((ps) => {
                    const isDue = ps.balance > 0;
                    return (
                      <tr key={ps.worker.id} className="hover:bg-white/5 transition">
                        <td className="p-3 font-semibold text-white">
                          <button 
                            onClick={() => setActiveModalWorker(ps)}
                            className="text-left hover:text-cyan-300 transition cursor-pointer"
                          >
                            {ps.worker.name}
                            <span className="block text-[10px] text-slate-500 font-normal">{ps.worker.phone}</span>
                          </button>
                        </td>
                        <td className="p-3 font-orbitron text-slate-300">৳{ps.worker.dailyWage}</td>
                        <td className="p-3 text-center font-orbitron text-cyan-300 font-bold">{ps.totalDays} দিন</td>
                        <td className="p-3 text-right font-orbitron text-cyan-400">৳{ps.totalEarned.toLocaleString()}</td>
                        <td className="p-3 text-right font-orbitron text-slate-300">৳{ps.totalPaid.toLocaleString()}</td>
                        <td className="p-3 text-right font-orbitron text-[#ff416c]">৳{ps.totalAdvance.toLocaleString()}</td>
                        <td className="p-3 text-right font-orbitron text-[#ff416c] font-bold">৳{ps.totalPaidAll.toLocaleString()}</td>
                        <td className="p-3 text-right font-orbitron font-bold">
                          <span className={`px-2.5 py-1 rounded-lg ${isDue ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-[#ff416c]/15 text-[#ff416c] border border-[#ff416c]/30'}`}>
                            {isDue ? `+৳ ${ps.balance.toLocaleString()}` : `-৳ ${Math.abs(ps.balance).toLocaleString()}`}
                          </span>
                        </td>
                        <td className="p-3 text-center no-print">
                          <div className="flex items-center justify-center gap-1.5">
                            <button 
                              onClick={() => setActiveModalWorker(ps)}
                              className="px-2 py-1 rounded bg-white/10 hover:bg-cyan-500/20 text-slate-300 hover:text-cyan-300 transition text-[11px] cursor-pointer"
                            >
                              খতিয়ান
                            </button>
                            <button 
                              onClick={() => handleDeleteWorker(ps.worker.id)}
                              className="px-2 py-1 rounded bg-red-500/10 hover:bg-red-500/20 text-red-400 transition text-[11px] cursor-pointer"
                            >
                              ডিলিট
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Worker Detail Modal with Full Remarks / Notes Log */}
          {activeModalWorker && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel w-full max-w-2xl rounded-2xl border border-white/20 p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
                  <div>
                    <h3 className="text-lg font-bold text-white">{activeModalWorker.worker.name} — খতিয়ান</h3>
                    <p className="text-xs text-cyan-400">{BANGLA_MONTHS[selectedMonth - 1]} {toBanglaNumber(selectedYear)} | দৈনিক মজুরি: ৳{activeModalWorker.worker.dailyWage}</p>
                  </div>
                  <button 
                    onClick={() => setActiveModalWorker(null)}
                    className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300 text-sm cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                {/* Summary badges */}
                <div className="grid grid-cols-3 gap-3 mb-4 text-center">
                  <div className="p-2.5 rounded-xl bg-black/40 border border-white/5">
                    <div className="text-[10px] text-slate-400">মোট হাজিরা</div>
                    <div className="font-orbitron font-bold text-cyan-300">{activeModalWorker.totalDays} দিন</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-black/40 border border-white/5">
                    <div className="text-[10px] text-slate-400">কাজের মূল্য</div>
                    <div className="font-orbitron font-bold text-emerald-400">৳{activeModalWorker.totalEarned}</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-black/40 border border-white/5">
                    <div className="text-[10px] text-slate-400">মোট পরিশোধ</div>
                    <div className="font-orbitron font-bold text-[#ff416c]">৳{activeModalWorker.totalPaidAll}</div>
                  </div>
                </div>

                <div className="text-xs font-semibold text-slate-300 mb-2">এই মাসের দৈনিক রেকর্ড ও সাইট রিমার্কস (Remarks):</div>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {activeModalWorker.records.length > 0 ? (
                    activeModalWorker.records.map(r => (
                      <div key={r.id} className="p-3 rounded-xl bg-black/30 border border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                        <div>
                          <div className="font-orbitron font-bold text-white">{r.date}</div>
                          <div className="text-[11px] text-cyan-300 mt-0.5">
                            {r.notes ? `📝 ${r.notes}` : 'হাজিরা এন্ট্রি'}
                          </div>
                        </div>
                        <div className="text-right flex items-center justify-end gap-3">
                          <span className="font-orbitron text-cyan-300 font-bold">{r.days} দিন</span>
                          <span className="font-orbitron text-slate-300">মজুরি: ৳{r.paid}</span>
                          <span className="font-orbitron text-[#ff416c]">অগ্রিম: ৳{r.advance}</span>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="text-center py-6 text-slate-500 text-xs">এই মাসে কোনো রেকর্ড নেই</div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 3D Three.js Architecture Background
    function initThreeBackground() {
      const container = document.getElementById('three-bg');
      if (!container) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 80;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const particleCount = 600;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 200;
        positions[i + 1] = (Math.random() - 0.5) * 200;
        positions[i + 2] = (Math.random() - 0.5) * 150;

        colors[i] = 0.0;
        colors[i + 1] = 0.95;
        colors[i + 2] = 0.99;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.55,
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Wireframe Icosahedron
      const icoGeo = new THREE.IcosahedronGeometry(25, 1);
      const icoMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, transparent: true, opacity: 0.06 });
      const icoMesh = new THREE.Mesh(icoGeo, icoMat);
      scene.add(icoMesh);

      function animate() {
        requestAnimationFrame(animate);
        particles.rotation.y += 0.0004;
        particles.rotation.x += 0.0002;
        icoMesh.rotation.x += 0.0008;
        icoMesh.rotation.y += 0.001;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    initThreeBackground();
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
